[package]
name = "vault"
description = "A deliberately buggy example contract used in soroban-testkit's docs and tests."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

# Issue #276: Explicit fixture metadata
# This example is for testing and documentation only, not for production use
authors.workspace = true
repository.workspace = true
documentation.workspace = true
keywords = ["soroban", "stellar", "example", "testing", "fixture"]
categories = ["development-tools::testing"]

[package.metadata]
# Explicitly mark this as a test fixture to prevent accidental inclusion
# in published artifacts or dependency resolution
test-fixture = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
