# Supply-chain policy enforced by `cargo deny check` (see .github/workflows/ci.yml's
# `deny` job). Run `cargo deny check` locally before relying on a new dependency.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# `cargo deny check licenses` is the focused CI regression gate for this list.
# A dependency with any other detected license must be reviewed and added to
# `exceptions` with a reason, rather than silently widening this allowlist.
# Allowed licenses for this project and its dependency graph. Add to this
# list deliberately, not to silence a failing check — a license outside
# this set needs a documented reason (add it to `exceptions` below instead
# of widening `allow`).
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Exceptions to the license allowlist. The list is intentionally empty:
# every dependency must carry an allowed license. If a dependency with a
# non-allowed license is genuinely required, add it here *and* document the
# exception on the line above with:
#   - rationale: why the non-allowed license is needed
#   - review-date: YYYY-MM-DD when the exception should be re-evaluated
#
# Example (do not uncomment unless a real exception exists):
# exceptions = [
#   "some-crate",  # rationale: ... ; review-date: 2026-01-01
# ]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
